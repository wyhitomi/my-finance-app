# ADR-0010. Install with `make setup` (pre-commit + commit-msg hooks).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$ # tsconfig allows comments
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, spec]

  # Local hooks reuse the locked tool versions from apps/api (uv) and apps/web (pnpm).
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (api)
        entry: bash -c 'cd apps/api && uv run ruff format "${@#apps/api/}"' --
        language: system
        types: [python]
        files: ^apps/api/
      - id: ruff
        name: ruff check (api)
        entry: bash -c 'cd apps/api && uv run ruff check --fix "${@#apps/api/}"' --
        language: system
        types: [python]
        files: ^apps/api/
      - id: mypy
        name: mypy strict (api)
        entry: uv run --directory apps/api mypy
        language: system
        types: [python]
        files: ^apps/api/src/
        pass_filenames: false
      - id: import-linter
        name: module boundaries (api)
        entry: uv run --directory apps/api lint-imports
        language: system
        types: [python]
        files: ^apps/api/src/
        pass_filenames: false
      - id: prettier
        name: prettier (web)
        entry: bash -c 'cd apps/web && pnpm exec prettier --write --ignore-unknown "${@#apps/web/}"' --
        language: system
        files: ^apps/web/
        exclude: pnpm-lock\.yaml$
      - id: eslint
        name: eslint (web)
        entry: bash -c 'cd apps/web && pnpm exec eslint --fix "${@#apps/web/}"' --
        language: system
        files: ^apps/web/.*\.(ts|tsx)$
      - id: openspec
        name: openspec validate
        entry: env OPENSPEC_TELEMETRY=0 npx -y @fission-ai/openspec@1.13.1 validate --all --strict --no-interactive
        language: system
        files: ^openspec/
        pass_filenames: false
