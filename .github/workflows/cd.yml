name: CD

# Builds and publishes container images on every push to main (ADR-0010).
# Called by the Release workflow with a version to also publish semver tags (ADR-0017).
# Deployment to a hosting provider will be added once a hosting ADR is accepted.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      app:
        description: App to build (api or web)
        type: string
        required: true
      version:
        description: Released version (X.Y.Z) to tag the image with
        type: string
        required: true
      ref:
        description: Commit to build (the merge commit on main when called by Release)
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build & push ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(inputs.app && format('["{0}"]', inputs.app) || '["api","web"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=sha,enable=${{ inputs.version == '' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
