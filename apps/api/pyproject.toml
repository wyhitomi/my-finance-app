[project]
name = "finance-api"
version = "0.2.0"
description = "Personal finance manager API (modular monolith)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20", "SIM", "RUF", "PT", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["finance_api"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=finance_api --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
markers = ["architecture: module boundary checks (import-linter)"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["finance_api"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.importlinter]
root_package = "finance_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent of each other"
type = "independence"
modules = [
    "finance_api.modules.identity",
    "finance_api.modules.accounts",
    "finance_api.modules.ledger",
    "finance_api.modules.budgeting",
    "finance_api.modules.reporting",
]

[[tool.importlinter.contracts]]
name = "Shared kernel depends on no module"
type = "forbidden"
source_modules = ["finance_api.shared_kernel"]
forbidden_modules = ["finance_api.modules", "finance_api.core", "finance_api.api", "finance_api.main"]

[[tool.importlinter.contracts]]
name = "Domain layers are framework-free"
type = "forbidden"
source_modules = [
    "finance_api.shared_kernel",
    "finance_api.modules.identity.domain",
    "finance_api.modules.accounts.domain",
    "finance_api.modules.ledger.domain",
    "finance_api.modules.budgeting.domain",
    "finance_api.modules.reporting.domain",
]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "pydantic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers inside each module"
type = "layers"
containers = [
    "finance_api.modules.identity",
    "finance_api.modules.accounts",
    "finance_api.modules.ledger",
    "finance_api.modules.budgeting",
    "finance_api.modules.reporting",
]
layers = ["api", "infrastructure", "application", "domain"]
